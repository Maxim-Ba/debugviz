name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum
      - name: go test
        run: go test ./...
      - name: wire dry-run demo apps
        run: |
          go run ./go/cmd/debugviz wire --config debugviz.yaml --dry-run ./demo/http
          go run ./go/cmd/debugviz wire --config demo/grpc/debugviz.yaml --dry-run ./demo/grpc
          go run ./go/cmd/debugviz wire --config demo/cli/debugviz.yaml --dry-run ./demo/cli
          go run ./go/cmd/debugviz wire --config demo/worker/debugviz.yaml --dry-run ./demo/worker
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          args: ./go/... ./demo/...

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - name: smoke epic2
        run: pnpm --filter @debugviz/server smoke:epic2
      - name: smoke epic6
        run: pnpm --filter @debugviz/server smoke:epic6
      - name: smoke epic7
        run: pnpm --filter @debugviz/server smoke:epic7

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: rustfmt check
        run: cargo fmt --check --manifest-path rust/layout/Cargo.toml
      - name: wasm-pack build
        working-directory: rust/layout
        run: wasm-pack build --target web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: docker compose up
        run: docker compose up -d --build --wait
      - name: smoke epic7 docker
        run: node server/scripts/smoke-epic7.mjs --docker
      - name: Install grpcurl
        run: |
          curl -sSL "https://github.com/fullstorydev/grpcurl/releases/download/v1.9.3/grpcurl_1.9.3_linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin grpcurl
      - name: smoke epic8 docker
        run: node server/scripts/smoke-epic8.mjs --docker
